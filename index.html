<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1317">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Pre-Trip Walkaround</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-height app, 3D yard left, inspection clipboard panel right; stacks on phones. Dark cab-console look with hi-vis amber and inspection-tag red. */
:root{
  --bg:#0e1317; --panel:#161d23; --panel2:#1c252c; --line:#2a353e;
  --fg:#e9eef1; --muted:#97a5af; --amber:#f2b705; --amber-ink:#1a1400;
  --good:#4cc38a; --bad:#ef6a5a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--amber);display:grid;place-items:center}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 14px var(--body);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-variant-numeric:tabular-nums}
.pill b{font-family:var(--display);font-size:20px;letter-spacing:.02em}
.pill.warn b{color:var(--bad)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0}
#stage{position:relative;border-radius:10px;overflow:hidden;background:#9fb8cc;min-height:320px;border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint-chip{position:absolute;left:12px;top:12px;font-size:12px;color:#dfe6ea;background:rgba(14,19,23,.8);border:1px solid var(--line);border-radius:999px;padding:5px 10px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font:600 12px var(--body);padding:4px 8px;border-radius:4px;transform:translate(-50%,-140%);white-space:nowrap}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:rgba(14,19,23,.85);color:var(--fg);font:700 22px var(--body);cursor:pointer;display:grid;place-items:center}
.zoom button:hover{border-color:var(--amber)}
.stations{position:absolute;left:12px;bottom:12px;right:72px;display:flex;flex-wrap:wrap;gap:6px}
.stations button{font:600 12px var(--body);color:var(--fg);background:rgba(14,19,23,.85);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.stations button:hover,.stations button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.hoodbtn{position:absolute;right:12px;top:12px;font:600 13px var(--body);color:var(--amber-ink);background:var(--amber);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.hoodbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card{background:var(--panel2);border:1px solid var(--amber);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--display);font-size:24px;line-height:1.1;margin:0}
.card .what{color:var(--fg);font-size:14px}
.card .sec{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card svg{width:100%;height:auto;display:block}
.btn.ok{background:var(--good);border-color:var(--good);color:#06150d}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#1a0503}
.stick{position:sticky;top:-18px;z-index:2;background:var(--panel);margin:-18px -18px 0;padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.hintbox{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:14px}
.cl{display:grid;gap:10px}
.cl h4{margin:0;display:flex;justify-content:space-between;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.cl h4 span{color:var(--muted);font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
.cl ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px}
.cl li button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:5px 6px;color:var(--muted);font:500 13px var(--body);cursor:pointer}
.cl li button:hover{background:var(--panel2);color:var(--fg)}
.cl li button.sel{background:var(--panel2);color:var(--amber)}
.cl .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 11px var(--body)}
.cl .ic.ok{background:var(--good);border-color:var(--good);color:#06150d}
.cl .ic.bad{background:var(--bad);border-color:var(--bad);color:#1a0503}
.cl li button.done{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.panel h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn:focus-visible,.stations button:focus-visible,.zoom button:focus-visible,.mode:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.modes{display:grid;gap:8px}
.mode{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.mode:hover{border-color:var(--amber)}
.mode strong{display:block;font-family:var(--display);font-size:22px;letter-spacing:.02em}
.mode span{color:var(--muted);font-size:14px}
.writeup{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.writeup li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:8px 10px;font-size:14px}
.writeup li button{background:none;border:0;color:var(--muted);cursor:pointer;font:600 12px var(--body)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:14px}
.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.res .tag{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:3px 6px}
.res .ok{background:rgba(76,195,138,.15);color:var(--good)}
.res .miss{background:rgba(239,106,90,.15);color:var(--bad)}
.res .fa{background:rgba(242,183,5,.15);color:var(--amber)}
.res li button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);cursor:pointer;font:600 12px var(--body);padding:4px 8px}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-size:48px;line-height:1}
.fine{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
@media (max-width:860px){.app{height:auto}.main{grid-template-columns:1fr}#stage{height:56vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1a1400" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="3" width="12" height="15" rx="2"/><path d="M7.5 10l2 2 3.5-4"/></svg></div>
      <h1>Pre-Trip Walkaround</h1>
    </div>
    <div class="hud">
      <div class="pill" id="h-time">Time <b>0:00</b></div>
      <div class="pill" id="h-checked">Checked <b>0/0</b></div>
      <div class="pill" id="h-found">Written up <b>0</b></div>
    </div>
  </header>
  <div class="main">
    <div id="stage">
      <div class="hint-chip" id="chip">Drag to look around · + / − to zoom · tap a part to inspect it</div>
      <button class="hoodbtn" id="hood-btn">Open hood</button>
      <div id="tip" hidden></div>
      <div class="stations" id="stations"></div>
      <div class="zoom">
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out">&minus;</button>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'), panel=document.getElementById('panel'), tip=document.getElementById('tip');
const FT=0.3048, TW=102*0.0254, TOP=13.5*FT, TL=53*FT, R=0.505, WY=0.51;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- renderer / yard ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fb8cc); scene.fog=new THREE.Fog(0x9fb8cc,80,220);
const camera=new THREE.PerspectiveCamera(40,1,0.05,500);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=1.2; controls.maxDistance=45;
scene.add(new THREE.HemisphereLight(0xdfeeff,0x4a4436,0.7));
const sun=new THREE.DirectionalLight(0xfff2dd,1.5); sun.position.set(14,30,18); sun.target.position.set(-4,0,0);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0004;
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:90});
scene.add(sun); scene.add(sun.target);
function asphaltTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#3d4043';g.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){const v=48+Math.random()*36|0;g.fillStyle='rgb('+v+','+v+','+(v+2)+')';g.fillRect(Math.random()*256,Math.random()*256,1.6,1.6);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.repeat.set(30,30);t.anisotropy=8;return t;
}
const grass=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x4f6b32,roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.y=-0.02;scene.add(grass);
const pad=new THREE.Mesh(new THREE.PlaneGeometry(90,40),new THREE.MeshStandardMaterial({map:asphaltTex(),roughness:.95}));pad.rotation.x=-Math.PI/2;pad.position.set(-4,0,0);pad.receiveShadow=true;scene.add(pad);
for(const z of[-2.3,2.3]){const s=new THREE.Mesh(new THREE.PlaneGeometry(30,0.12),new THREE.MeshBasicMaterial({color:0xe8e2cf}));s.rotation.x=-Math.PI/2;s.position.set(-4,0.01,z);scene.add(s);}
/* ---------- materials (from the Backup Semi Trailer truck) ---------- */
const M={
  paint:new THREE.MeshStandardMaterial({color:0xb3121b,metalness:0.45,roughness:0.32}),
  chrome:new THREE.MeshStandardMaterial({color:0xdde3e8,metalness:1,roughness:0.15}),
  alum:new THREE.MeshStandardMaterial({color:0xc4c9cd,metalness:0.8,roughness:0.35}),
  black:new THREE.MeshStandardMaterial({color:0x151617,roughness:0.6,metalness:0.2}),
  rubber:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.95}),
  frame:new THREE.MeshStandardMaterial({color:0x222426,roughness:0.7,metalness:0.4}),
  glass:new THREE.MeshStandardMaterial({color:0x1e2a33,metalness:0.6,roughness:0.08}),
  trailer:new THREE.MeshStandardMaterial({color:0xf3f4f2,roughness:0.5,metalness:0.15}),
  amber:new THREE.MeshStandardMaterial({color:0xffa31a,roughness:0.4}),
  red:new THREE.MeshStandardMaterial({color:0xc81414,roughness:0.4}),
  head:new THREE.MeshStandardMaterial({color:0xf4f6ff,roughness:0.2,metalness:0.3}),
  tapeR:new THREE.MeshStandardMaterial({color:0xd8211d,roughness:0.3,emissive:0x3a0000}),
  tapeW:new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0x222222}),
  dump:new THREE.MeshStandardMaterial({color:0x8a9196,metalness:0.55,roughness:0.4}),
  gravel:new THREE.MeshStandardMaterial({color:0x8d8273,roughness:1}),
  chain:new THREE.MeshStandardMaterial({color:0xd5dbe0,metalness:.9,roughness:.3,emissive:0x000000}),
  ghost:new THREE.MeshBasicMaterial({color:0xf2b705,transparent:true,opacity:.65}),
  hook:new THREE.MeshStandardMaterial({color:0x4cc38a,emissive:0x1f6b47}),
  tens:new THREE.MeshStandardMaterial({color:0xc0392b,roughness:.6}),
  post:new THREE.MeshStandardMaterial({color:0x7d858c,metalness:.4,roughness:.5}),
};
const postMat=new THREE.MeshStandardMaterial({color:0xd7dadb,roughness:0.45,metalness:0.4});
const doorMat=new THREE.MeshStandardMaterial({color:0xe9ebea,roughness:0.5,metalness:0.2});
const fenderMat=new THREE.MeshStandardMaterial({color:0x151617,roughness:0.6,side:THREE.DoubleSide});
const frontFender=M.paint.clone(); frontFender.side=THREE.DoubleSide;

function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(r,len,mat,x,y,z,axis,parent,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||24),mat);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function rod(p,a,b,r,m){const d=new THREE.Vector3().subVectors(b,a);const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);c.position.copy(a).addScaledVector(d,.5);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());p.add(c);return c;}
function textPlane(lines,w,h,fg,bg,size){
  const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
  const x=c.getContext('2d');
  if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);}
  x.fillStyle=fg;x.font='700 '+size+'px "Barlow Condensed", "Arial Narrow", sans-serif';x.textAlign='center';x.textBaseline='middle';
  lines.forEach((l,i)=>x.fillText(l,c.width/2,c.height/2+(i-(lines.length-1)/2)*size*1.05));
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:!bg,side:THREE.DoubleSide}));
}
function woodTex(){
  const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  for(let i=0;i<8;i++){const v=110+Math.random()*40|0;g.fillStyle='rgb('+v+','+(v*0.68|0)+','+(v*0.42|0)+')';g.fillRect(0,i*8,256,8);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,i*8+7,256,1);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;
}

/* chain-up area sign */
/* ---------- tires ---------- */
const tires=[]; let pickMeshes=[]; let driveCount=2; let regTires=true;
function tireChain(w,mat){
  const g=new THREE.Group();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const b=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.035,w+0.05),mat);b.position.set(Math.cos(a)*(R+0.014),Math.sin(a)*(R+0.014),0);b.rotation.z=a;g.add(b);}
  for(const s of[-1,1]){const t=new THREE.Mesh(new THREE.TorusGeometry(R-0.04,0.014,6,48),mat);t.position.z=s*(w/2+0.012);g.add(t);}
  return g;
}
function tireUnit(parent,x,z,w,outer,side,spins){
  const g=new THREE.Group(); g.position.set(x,WY,z); parent.add(g);
  const spin=new THREE.Group(); g.add(spin); if(spins) spins.push(spin);
  const mat=M.rubber.clone(); mat.emissive=new THREE.Color(0x000000);
  const tor=new THREE.Mesh(new THREE.TorusGeometry(0.39,0.13,14,36),mat); tor.scale.z=w/0.26; tor.castShadow=true; spin.add(tor);
  const tread=new THREE.Mesh(new THREE.CylinderGeometry(R,R,w,36,1,true),mat); tread.rotation.x=Math.PI/2; tread.castShadow=true; spin.add(tread);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.29,0.29,w-0.03,28),outer?M.alum:M.frame); rim.rotation.x=Math.PI/2; spin.add(rim);
  if(outer){
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.14,16),M.chrome); hub.rotation.x=Math.PI/2; hub.position.z=side*(w/2+0.005); spin.add(hub);
    for(let k=0;k<10;k++){const a=k/10*Math.PI*2;const n=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.05,6),M.chrome);n.rotation.x=Math.PI/2;n.position.set(Math.cos(a)*0.2,Math.sin(a)*0.2,side*(w/2-0.005));spin.add(n);}
  }
  return {g,spin,meshes:[tor,tread],mat};
}
function wheelSet(parent,x,side,type,info,spins){
  const list=type==='steer'?[[side*(TW/2-0.16),0.27,true,'single']]
    :type==='single'?[[side*0.95,0.44,true,'single']]
    :[[side*(TW/2-0.2),0.27,true,'outer'],[side*(TW/2-0.5),0.27,false,'inner']];
  list.forEach(([z,w,outer,pos])=>{
    const u=tireUnit(parent,x,z,w,outer,side,spins);
    if(!info||!regTires) return;
    const chainG=tireChain(w,M.chain); chainG.visible=false; u.g.add(chainG);
    const ghostG=tireChain(w,M.ghost); ghostG.visible=false; u.g.add(ghostG);
    const rec=Object.assign({},info,{side:side>0?'R':'L',pos,w,chained:false,chainG,ghostG,mat:u.mat});
    u.meshes.forEach(m=>{m.userData.tire=rec;pickMeshes.push(m);});
    tires.push(rec);
  });
}

/* ---------- tractor (from 3DTruck), with day-cab dump option ---------- */
function buildTractor(o){
  const g=new THREE.Group(), sp=o.spins||null;
  const axles=o.drives===2?[0.72,-0.6]:[-0.25];
  const rearAx=axles[axles.length-1];
  const fwX=o.drives===2?-0.6:-0.1;
  const STEER=6.6,SL0=1.95,SL1=3.85,CB1=5.7,HD1=7.95;
  const frameRear=o.day?-2.8:rearAx-1.0;
  [0.43,-0.43].forEach(z=>box(HD1+0.2-frameRear,0.28,0.1,M.frame,(frameRear+HD1+0.2)/2,0.92,z,g));
  if(!o.day){box(1.1,0.12,1.2,M.frame,fwX,1.13,0,g);box(1.0,0.06,1.25,M.black,fwX+0.05,1.21,0,g);}
  axles.forEach((x,i)=>{
    cyl(0.07,2.0,M.frame,x,WY,0,'z',g,12);
    cyl(0.18,0.25,M.black,x,0.52,0,'z',g,16);
    [1,-1].forEach(s=>cyl(0.15,0.3,M.black,x+0.5,0.9,s*0.45,null,g,16));
    [1,-1].forEach(s=>wheelSet(g,x,s,o.tire==='single'?'single':'dual',{role:'drive',axle:i},sp));
    [1,-1].forEach(s=>{
      const fg=new THREE.CylinderGeometry(0.66,0.66,0.62,24,1,true,-Math.PI*0.45,Math.PI*0.9);fg.rotateX(-Math.PI/2);
      const f=new THREE.Mesh(fg,fenderMat);f.position.set(x,0.53,s*(TW/2-0.35));f.castShadow=true;g.add(f);
    });
  });

}

function crackCanvas(base,line,lw){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  if(base){g.fillStyle=base;g.fillRect(0,0,256,256);}
  g.strokeStyle=line;g.lineWidth=lw;g.lineCap='round';
  const cx=90+Math.random()*76,cy=90+Math.random()*76;
  for(let i=0;i<10;i++){let a=i/10*Math.PI*2+Math.random()*0.5,x=cx,y=cy;g.beginPath();g.moveTo(x,y);
    for(let k=0;k<7;k++){a+=(Math.random()-.5)*0.7;const L=14+Math.random()*24;x+=Math.cos(a)*L;y+=Math.sin(a)*L;g.lineTo(x,y);}g.stroke();}
  for(let r=12;r<=36;r+=12){g.beginPath();for(let k=0;k<=14;k++){const a=k/14*Math.PI*2,rr=r*(0.75+Math.random()*0.5),px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;k?g.lineTo(px,py):g.moveTo(px,py);}g.stroke();}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}

const latch=box(0.04,0.06,0.28,M.chrome,0,0,0.14,doorH);
box(0.04,0.06,0.28,M.chrome,doorX,1.8,-TW*0.25+0.14,rig);
addPart({id:'doors',section:'rear',name:'Rear doors and latches',what:'Doors closed, latch handles locked down, hinges secure.',pos:V(doorX,2.5,0),side:0,rear:true,hit:[hitBox(0.15,2.6,TW,doorX,2.6,0)],flagY:4.4,
  defects:[{label:'Door latch handle not secured',apply(){doorH.rotation.y=-1.2;},clear(){doorH.rotation.y=0;}}]});
let guard=null;van.g.traverse(o=>{const gp=o.geometry&&o.geometry.parameters;if(o.isMesh&&gp&&gp.width===0.12&&gp.height===0.12&&Math.abs(gp.depth-(TW-0.2))<0.01&&wp(o).x<VAN_REAR+0.3)guard=o;});
if(guard){const gp=wp(guard),gy=guard.position.y;
  addPart({id:'guard',section:'rear',name:'Rear impact guard',what:'Guard straight, secure and not damaged.',pos:gp,side:0,rear:true,hit:[hitBox(0.4,0.6,TW,gp.x+0.05,0.75,0)],flagY:1.5,
    defects:[{label:'Rear impact guard bent',apply(){guard.rotation.y=0.2;guard.rotation.x=0.18;guard.position.y=gy-0.1;},clear(){guard.rotation.set(0,0,0);guard.position.y=gy;}}]});}

/* hood itself is tappable to open/close, and blocks taps into the engine when closed */
hoodMeshes.forEach(m=>{m.userData.hood=true;pick.push(m);});

/* ---------- effects ---------- */
const effects=[];
function startLeak(p){
  const ps=[];for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6,depthWrite:false}));rig.add(m);ps.push({m,ph:i/18,dx:(Math.random()-.5)*0.6,dy:0.3+Math.random()*0.5,dz:-0.4-Math.random()*0.4});}
  effects.push({key:'air',type:'air',p,ps});
}
function startDrip(key,p,mat,puddleAt,sx){
  const pud=new THREE.Mesh(new THREE.CircleGeometry(0.4,28),mat);pud.rotation.x=-Math.PI/2;pud.scale.set(sx||1.2,1,1);pud.position.copy(puddleAt);rig.add(pud);
  const ps=[];for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.018,8,6),mat);rig.add(m);ps.push({m,ph:i/3,dx:(i-1)*0.12});}
  effects.push({key,type:'drip',p,ps,extra:[pud]});
}
function stopEffects(key){for(let i=effects.length-1;i>=0;i--){const e=effects[i];if(e.key!==key)continue;e.ps.forEach(q=>rig.remove(q.m));(e.extra||[]).forEach(m=>rig.remove(m));effects.splice(i,1);}}
function tickEffects(t){
  effects.forEach(e=>e.ps.forEach(q=>{
    if(e.type==='air'){const k=(t*0.9+q.ph)%1;q.m.position.set(e.p.x+q.dx*k,e.p.y+q.dy*k,e.p.z+q.dz*k);q.m.scale.setScalar(0.4+k*2.2);q.m.material.opacity=0.55*(1-k);}
    else{const k=(t*0.7+q.ph)%1;q.m.position.set(e.p.x+q.dx,e.p.y-k*(e.p.y-0.02),e.p.z);}
  }));
}

/* ---------- flags and selection marker ---------- */
const flagMat=new THREE.MeshStandardMaterial({color:0xe23b2e,roughness:.5,side:THREE.DoubleSide});
const missMat=new THREE.MeshStandardMaterial({color:0xf2b705,roughness:.5,side:THREE.DoubleSide});
function makeFlag(p,mat){
  const g=new THREE.Group();
  rod(g,V(0,0,0),V(0,0.45,0),0.012,M.black);
  const f=new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.18),mat||flagMat);f.position.set(0.14,0.36,0);g.add(f);
  const y=p.flagY||(p.pos.y+0.5);g.position.set(p.pos.x,y,p.pos.z+(p.side?p.side*0.15:0));rig.add(g);return g;
}
const selMark=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.22,16),new THREE.MeshBasicMaterial({color:0xf2b705}));selMark.rotation.x=Math.PI;selMark.visible=false;scene.add(selMark);

/* ---------- camera ---------- */
let fly=null;
function flyTo(p,t){const cross=Math.sign(camera.position.z)!==Math.sign(p.z)&&Math.abs(camera.position.z)>1&&Math.abs(p.z)>1;fly={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),bump:cross?7:2.0};}
const stEl=document.getElementById('stations');
stEl.innerHTML='<button data-id="whole">Whole rig</button>'+SECTIONS.map(s=>'<button data-id="'+s.id+'">'+s.label.replace(' compartment','').replace(' of the truck','').replace(' of the trailer','')+'</button>').join('');
function goSection(id){
  if(id==='whole')flyTo(V(8,9,15),V(-4,1,0));
  else{const s=SECTIONS.find(x=>x.id===id);flyTo(V(...s.view.p),V(...s.view.t));if(id==='engine'&&!hoodOpen)setHood(true);}
  stEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));
}
stEl.querySelectorAll('button').forEach(b=>b.onclick=()=>goSection(b.dataset.id));
function viewFor(p){
  if(p.section==='engine'){const off=V(-0.3,1.9,p.pos.z<0?-2.4:2.4);return [p.pos.clone().add(off),p.pos.clone()];}
  if(p.front)return [V(p.pos.x+3.0,p.pos.y+0.9,p.pos.z+(p.side||-1)*2.2),p.pos.clone()];
  if(p.rear)return [V(p.pos.x-3.4,p.pos.y+0.9,p.pos.z+(p.side||-1)*2.0),p.pos.clone()];
  if(p.center)return [V(p.pos.x+1.2,p.pos.y+1.1,-3.6),p.pos.clone()];
  return [V(p.pos.x+1.6,p.pos.y+0.9,p.pos.z+p.side*3.4),p.pos.clone()];
}
function showPart(p){if(p.needHood&&!hoodOpen)setHood(true);const [c,t]=viewFor(p);flyTo(c,t);stEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));}

function zoomBy(f){const off=camera.position.clone().sub(controls.target);off.setLength(THREE.MathUtils.clamp(off.length()*f,controls.minDistance,controls.maxDistance));camera.position.copy(controls.target).add(off);}
let zHold=null;
[['z-in',0.8],['z-out',1.25]].forEach(([id,f])=>{const b=document.getElementById(id),stop=()=>{clearInterval(zHold);zHold=null;};
  b.addEventListener('pointerdown',e=>{e.preventDefault();zoomBy(f);stop();zHold=setInterval(()=>zoomBy(f),120);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomBy(f);}});});

/* ---------- game ---------- */
const G={state:'menu',mode:'practice',t0:0,limit:420,elapsed:0,result:null,sel:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BEST_KEY='pretrip.best.v2';
function getBest(){try{return JSON.parse(localStorage.getItem(BEST_KEY)||'{}')||{};}catch(e){return {};}}
function setBest(m,v){try{const b=getBest();if(!(b[m]>=v)){b[m]=v;localStorage.setItem(BEST_KEY,JSON.stringify(b));return true;}}catch(e){}return false;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function clearRound(){parts.forEach(p=>{if(p.defect){p.defect.clear();p.defect=null;}p.status=null;if(p.flag){rig.remove(p.flag);p.flag=null;}});G.sel=null;selMark.visible=false;}
function newRound(mode){
  clearRound();G.mode=mode;G.state='inspect';G.result=null;setHood(false);
  const n=3+Math.floor(Math.random()*3);let tires=0,engine=0;const chosen=[];
  for(const p of shuffle(parts.slice())){if(chosen.length>=n)break;if(p.isTire){if(tires>=2)continue;tires++;}if(p.section==='engine'){if(engine>=2)continue;engine++;}chosen.push(p);}
  chosen.forEach(p=>{p.defect=p.defects[Math.floor(Math.random()*p.defects.length)];p.defect.apply();});
  G.t0=performance.now();goSection('whole');render();
}
function select(p){G.sel=p;render();}
function setStatus(p,st){
  if(G.state!=='inspect')return;
  p.status=st;
  if(p.flag){rig.remove(p.flag);p.flag=null;}
  if(st==='defect')p.flag=makeFlag(p);
  const sec=parts.filter(q=>q.section===p.section);const next=sec.find(q=>!q.status);
  G.sel=next||null;render();
}
function signOff(){
  if(G.state!=='inspect')return;
  const secs=Math.round(G.elapsed);
  const found=parts.filter(p=>p.defect&&p.status==='defect'),missed=parts.filter(p=>p.defect&&p.status!=='defect'),fa=parts.filter(p=>!p.defect&&p.status==='defect'),unchecked=parts.filter(p=>!p.status);
  const checked=parts.length-unchecked.length;
  let score=checked*5+found.length*100-fa.length*50,bonus=0;
  if(G.mode==='timed'&&!missed.length&&!unchecked.length)bonus=Math.max(0,G.limit-secs);
  score=Math.max(0,score+bonus);
  G.result={found,missed,fa,unchecked,checked,score,bonus,secs,best:setBest(G.mode,score)};G.state='results';G.sel=null;selMark.visible=false;
  missed.forEach(p=>{if(p.flag)rig.remove(p.flag);p.flag=makeFlag(p,missMat);});
  render();
}

/* ---------- panel ---------- */

function checklistHTML(){
  return '<div class="cl">'+SECTIONS.map(s=>{const its=parts.filter(p=>p.section===s.id),done=its.filter(p=>p.status).length;
    return '<div><h4>'+s.label+'<span>'+done+'/'+its.length+'</span></h4>'+(s.id==='engine'&&!hoodOpen?'<p style="font-size:12px;margin:2px 0 0">Open the hood to check these.</p>':'')+'<ul>'+its.map(p=>'<li><button class="'+(p===G.sel?'sel ':'')+(p.status?'done':'')+'" data-id="'+p.id+'"><span class="ic '+(p.status==='ok'?'ok':p.status==='defect'?'bad':'')+'">'+(p.status==='ok'?'✓':p.status==='defect'?'!':'')+'</span>'+esc(p.name)+'</button></li>').join('')+'</ul></div>';}).join('')+'</div>';
}
function render(){
  const checked=parts.filter(p=>p.status).length;
  document.querySelector('#h-checked b').textContent=checked+'/'+parts.length;
  document.querySelector('#h-found b').textContent=parts.filter(p=>p.status==='defect').length;
  if(G.sel){selMark.visible=true;}else selMark.visible=false;
  if(G.state==='menu'){
    const b=getBest();
    panel.innerHTML='<div class="eyebrow">Pre-trip inspection</div><h2>Do a full circle check</h2>'+
      '<p>Work through a real pre-trip on your tractor and 53 ft van: under the hood, around the tractor, the coupling, the trailer and the rear. Tap each item, look it over, and mark it OK or write it up. Every round hides 3 to 5 defects.</p>'+
      '<div class="modes"><button class="mode" id="m-practice"><strong>Practice</strong><span>No clock. Learn what to check on each item.'+(b.practice!=null?' Best: '+b.practice:'')+'</span></button>'+
      '<button class="mode" id="m-timed"><strong>Timed · 7 minutes</strong><span>Check every item and find every defect before time runs out.'+(b.timed!=null?' Best: '+b.timed:'')+'</span></button></div>'+
      '<p>Scoring: 5 for each item checked, 100 for each defect found, minus 50 for writing up something that was fine.</p>'+
      '<p class="fine">A practice tool. Follow your provincial inspection schedule and your company’s procedures.</p>';
    document.getElementById('m-practice').onclick=()=>newRound('practice');
    document.getElementById('m-timed').onclick=()=>newRound('timed');
    return;
  }
  if(G.state==='inspect'){
    const p=G.sel;
    const card=p?('<div class="card"><div class="sec">'+SECTIONS.find(s=>s.id===p.section).label+'</div><h3>'+esc(p.name)+'</h3><p class="what">'+esc(p.what)+'</p>'+(p.gauge?p.gauge(p):'')+
      '<div class="row"><button class="btn ok" id="b-ok">Looks OK</button><button class="btn bad" id="b-def">Write up defect</button></div></div>')
      :'<div class="hintbox">Tap a part on the rig, or pick an item from the checklist below, to inspect it.</div>';
    const keep=panel.scrollTop;
    panel.innerHTML='<div class="stick"><div class="eyebrow">'+(G.mode==='timed'?'Timed inspection':'Practice inspection')+'</div>'+card+'</div>'+checklistHTML()+
      '<div class="row"><button class="btn primary" id="b-sign">Sign off inspection</button><button class="btn" id="b-quit">Main menu</button></div>';
    if(p){document.getElementById('b-ok').onclick=()=>setStatus(p,'ok');document.getElementById('b-def').onclick=()=>setStatus(p,'defect');}
    panel.querySelectorAll('.cl li button').forEach(b=>b.onclick=()=>{const q=parts.find(x=>x.id===b.dataset.id);select(q);showPart(q);});
    document.getElementById('b-sign').onclick=signOff;
    document.getElementById('b-quit').onclick=()=>{clearRound();G.state='menu';setHood(false);render();};
    panel.scrollTop=keep;
    const selB=panel.querySelector('.cl li button.sel');
    if(selB){const st=panel.querySelector('.stick').offsetHeight,pr=panel.getBoundingClientRect(),br=selB.getBoundingClientRect();
      if(br.top<pr.top+st+8)panel.scrollTop-=pr.top+st+8-br.top;else if(br.bottom>pr.bottom-8)panel.scrollTop+=br.bottom-pr.bottom+8;}
    return;
  }
  const r=G.result,total=r.found.length+r.missed.length;
  const row=(p,tag,cls,txt)=>'<li><span class="tag '+cls+'">'+tag+'</span><span>'+esc(txt)+'</span><button data-id="'+p.id+'">Show me</button></li>';
  panel.innerHTML='<div class="eyebrow">Inspection signed off</div><h2>'+(r.missed.length+r.fa.length+r.unchecked.length===0?'Complete, clean inspection':'Found '+r.found.length+' of '+total+' defects')+'</h2>'+
    '<div class="score"><b>'+r.score+'</b><span>points'+(r.bonus?' · '+r.bonus+' time bonus':'')+(r.best?' · new best':'')+'</span></div>'+
    '<p>Checked '+r.checked+' of '+parts.length+' items in '+fmt(r.secs)+'. Missed defects have yellow flags on the rig.</p>'+
    '<ul class="res">'+r.found.map(p=>row(p,'Found','ok',p.defect.label+' · '+p.name)).join('')+
      r.missed.map(p=>row(p,p.status?'Missed':'Not checked','miss',p.defect.label+' · '+p.name)).join('')+
      r.fa.map(p=>row(p,'Was fine','fa',p.name)).join('')+'</ul>'+
    (r.unchecked.filter(p=>!p.defect).length?'<p>Also not checked: '+r.unchecked.filter(p=>!p.defect).map(p=>esc(p.name)).join(', ')+'.</p>':'')+
    '<div class="row"><button class="btn primary" id="b-again">New inspection</button><button class="btn" id="b-menu">Main menu</button></div>';
  panel.querySelectorAll('.res button').forEach(b=>b.onclick=()=>showPart(parts.find(p=>p.id===b.dataset.id)));
  document.getElementById('b-again').onclick=()=>newRound(G.mode);
  document.getElementById('b-menu').onclick=()=>{clearRound();G.state='menu';setHood(false);render();};
}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
function hitAt(e){const r=renderer.domElement.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(pick.filter(m=>m.parent),false)[0];}
renderer.domElement.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt)return;const mv=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);downAt=null;if(mv>6)return;
  const h=hitAt(e);if(!h)return;
  if(h.object.userData.hood){setHood(!hoodOpen);render();return;}
  const p=h.object.userData.part;if(p&&G.state==='inspect')select(p);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(G.state==='menu'){tip.hidden=true;return;}
  const h=hitAt(e),p=h&&(h.object.userData.part||(h.object.userData.hood?{name:hoodOpen?'Close the hood':'Open the hood'}:null));
  if(p){const r=stage.getBoundingClientRect();tip.textContent=p.name;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.hidden=false;renderer.domElement.style.cursor='pointer';}
  else{tip.hidden=true;renderer.domElement.style.cursor='';}
});
renderer.domElement.addEventListener('pointerleave',()=>{tip.hidden=true;});

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
camera.position.set(8,9,15);controls.target.set(-4,1,0);
let last=performance.now(),lastHood=null;
function tick(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(fly){fly.t=Math.min(1,fly.t+dt/0.8);const k=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2;camera.position.lerpVectors(fly.p0,fly.p1,k);camera.position.y+=Math.sin(Math.PI*k)*fly.bump;controls.target.lerpVectors(fly.t0,fly.t1,k);if(fly.t>=1)fly=null;}
  const goal=hoodOpen?-1.22:0;hoodAng+=(goal-hoodAng)*Math.min(1,dt*4);hoodPivot.rotation.z=hoodAng;
  if(lastHood!==hoodOpen){lastHood=hoodOpen;if(G.state==='inspect')render();}
  if(G.sel){selMark.position.set(G.sel.pos.x,(G.sel.flagY||G.sel.pos.y+0.4)+0.55+Math.sin(now/250)*0.05,G.sel.pos.z);}
  if(G.state==='inspect'){
    G.elapsed=(now-G.t0)/1000;
    const shown=G.mode==='timed'?G.limit-G.elapsed:G.elapsed;
    const tEl=document.getElementById('h-time');tEl.querySelector('b').textContent=fmt(shown);tEl.classList.toggle('warn',G.mode==='timed'&&shown<30);
    if(G.mode==='timed'&&shown<=0)signOff();
  }
  tickEffects(now/1000);
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
render();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(tick),()=>requestAnimationFrame(tick));
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
